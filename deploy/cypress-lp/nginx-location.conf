location = /assets/js/lp-calculator.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/lp/full-range-simulator.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/lp/historical-state.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/comparison/hold-vs-rebalanced-lp.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/comparison/reference-fee.mjs {
    try_files $uri =404;
