location = /assets/js/lp-calculator.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/lp/full-range-simulator.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /tools/lp/historical-state.mjs {
    try_files $uri =404;
    default_type application/javascript;
    limit_except GET {
        deny all;
    }
}

location = /api/lp/v1/history.json {
    try_files $uri =404;
    default_type application/json;
    expires 5m;
    limit_except GET {
        deny all;
    }
}

location /api/lp/ {
    return 404;
}
